<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Админка - Добавить авто</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-light bg-white border-bottom sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
        
        <a class="navbar-brand fw-bold fs-4" href="/">
            🚗 AutoMarket
        </a>

        <div class="d-flex gap-2 align-items-center" id="auth-buttons"></div>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title mb-4">Добавить новый автомобиль</h3>
                    <form id="car-form">
                        <div class="mb-3"><input type="text" id="brand" class="form-control" placeholder="Марка (например, BMW)" required></div>
                        <div class="mb-3"><input type="text" id="model" class="form-control" placeholder="Модель" required></div>
                        <div class="mb-2 row">
                            <div class="col"><input type="number" id="price" class="form-control" placeholder="Цена (руб)" required></div>
                            <div class="col"><input type="number" id="year" class="form-control" placeholder="Год выпуска" required></div>
                        </div>
                        <div class="mb-3"><input type="number" id="mileage" class="form-control" placeholder="Пробег (км)" required></div>
                        <div class="mb-3"><textarea id="description" class="form-control" placeholder="Описание автомобиля" rows="3" required></textarea></div>
                        <div class="mb-3">
                            <label class="form-label">Фотография автомобиля</label>
                            <input type="file" id="fileInput" class="form-control" accept="image/*" required>
                        </div>
                            <label class="form-label text-muted small">Номер телефона для связи</label>
                            <input type="text" id="phone" class="form-control" placeholder="+7 (999) 000-00-00" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Сохранить в базу</button>
                    </form>
                    <div id="message" class="mt-3"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('car-form').onsubmit = async (e) => {
    e.preventDefault();

    const userId = localStorage.getItem('user_id');

    if (!userId) {
        alert("Сначала войдите в аккаунт");
        return;
    }

    const formData = new FormData();

    formData.append('brand', document.getElementById('brand').value);
    formData.append('model', document.getElementById('model').value);
    formData.append('price', document.getElementById('price').value);
    formData.append('year', document.getElementById('year').value);
    formData.append('mileage', document.getElementById('mileage').value);
    formData.append('description', document.getElementById('description').value);
    formData.append('owner_id', Number(userId));

    const fileField = document.getElementById('fileInput');
    formData.append('file', fileField.files[0]);

    try {
        const response = await fetch('/upload-car', {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            alert("Машина успешно выставлена!");
            window.location.href = '/profile';
        } else {
            alert("Ошибка при загрузке");
        }
    } catch (error) {
        console.error(error);
        alert("Ошибка соединения с сервером");
    }
};
</script>
</body>
</html>
